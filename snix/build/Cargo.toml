[package]
name = "snix-build"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true

[dependencies]
async-stream.workspace = true
auto_impl.workspace = true
bytes.workspace = true
itertools.workspace = true
prost.workspace = true
tonic-prost.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["process"] }
tokio-util = { workspace = true, features = ["io"] }
tonic.workspace = true
# TODO: put the fuse dep behind a feature flag?
snix-castore = { path = "../castore", features = ["fuse"] }
snix-tracing = { path = "../tracing", features = ["clap", "tonic"] }
tracing.workspace = true
tracing-futures = { version = "0.2.5", default-features = false, features = [
  "futures-03",
  "std-future",
] }
url.workspace = true

anyhow = "1.0.79"
blake3 = "1.5.0"
bstr = "1.6.0"
data-encoding = "2.5.0"
futures = "0.3.30"
oci-spec = "0.7.0"
nix = { version = "0.29.0", features = ["user"] }
serde_json = "1.0.111"
uuid = { version = "1.7.0", features = ["v4"] }
typed-builder = "0.22.0"

[build-dependencies]
tonic-prost-build.workspace = true

[features]
default = []

[dev-dependencies]
rstest.workspace = true
tempfile = "3.3.0"
# We want to use the castore test helpers in our tests too.
snix-castore = { path = "../castore", features = ["mocks"] }

[package.metadata.docs.rs]
all-features = true

[package.metadata.cargo-machete]
ignored = ["prost", "tonic-prost"]
